<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a3966" />
    </linearGradient>
    <linearGradient id="btnGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad1)" />

  <!-- Subtle grid pattern & decorative circles -->
  <circle cx="520" cy="80" r="140" fill="#0284c7" opacity="0.12" />
  <circle cx="80" cy="520" r="180" fill="#38bdf8" opacity="0.08" />

  <!-- Inner border card -->
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(48, 54)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#0284c7" />
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">척추·관절 중점 진료</text>
  </g>

  <!-- Medical Spine Icon illustration -->
  <g transform="translate(460, 60)" opacity="0.9">
    <circle cx="40" cy="40" r="36" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M40 20 L40 60 M26 30 L54 30 M22 40 L58 40 M26 50 L54 50" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Main Headline -->
  <text x="48" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    서울연세
  </text>
  <text x="48" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="40" font-weight="900" fill="#38bdf8" letter-spacing="-1">
    척추관절센터
  </text>

  <!-- Divider -->
  <line x1="48" y1="240" x2="552" y2="240" stroke="#334155" stroke-width="1.5" />

  <!-- Key Highlights -->
  <g transform="translate(48, 270)">
    <!-- Item 1 -->
    <circle cx="10" cy="15" r="5" fill="#38bdf8" />
    <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      비수술 맞춤 척추·도수치료
    </text>

    <!-- Item 2 -->
    <circle cx="10" cy="55" r="5" fill="#38bdf8" />
    <text x="26" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      정형외과·신경외과 전문의 협진
    </text>

    <!-- Item 3 -->
    <circle cx="10" cy="95" r="5" fill="#38bdf8" />
    <text x="26" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
      당일 정밀 MRI 검사 및 판독
    </text>
  </g>

  <!-- Bottom CTA Container -->
  <g transform="translate(48, 435)" filter="url(#shadow1)">
    <rect x="0" y="0" width="504" height="96" rx="14" fill="url(#btnGrad1)" />
    
    <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="15" font-weight="600" fill="#bae6fd">
      대표 진료 상담 예약
    </text>
    <text x="32" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      1588-3482
    </text>

    <!-- Arrow button -->
    <g transform="translate(420, 26)">
      <circle cx="24" cy="24" r="24" fill="#ffffff" />
      <path d="M20 16 L28 24 L20 32" stroke="#0369a1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Small Footer Tag -->
  <text x="300" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">
    보건복지부 의료광고 심의필 제2026-0000호
  </text>
</svg>
