<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="btnGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="0%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad2)" />

  <!-- Subtle circles -->
  <circle cx="500" cy="90" r="150" fill="#10b981" opacity="0.12" />
  <circle cx="100" cy="500" r="160" fill="#34d399" opacity="0.08" />

  <!-- Inner border card -->
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#047857" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(48, 54)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#059669" />
    <text x="95" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">국민건강보험 지정 검진</text>
  </g>

  <!-- Health Shield Icon -->
  <g transform="translate(460, 60)" opacity="0.9">
    <circle cx="40" cy="40" r="36" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <!-- Shield / Heart cross -->
    <path d="M40 24 L56 30 L56 46 C56 56 40 64 40 64 C40 64 24 56 24 46 L24 30 Z" fill="none" stroke="#34d399" stroke-width="2.5" />
    <path d="M40 34 L40 46 M34 40 L46 40" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Main Headline -->
  <text x="48" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    한국메디컬
  </text>
  <text x="48" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="40" font-weight="900" fill="#6ee7b7" letter-spacing="-1">
    종합건강검진센터
  </text>

  <!-- Divider -->
  <line x1="48" y1="240" x2="552" y2="240" stroke="#047857" stroke-width="1.5" />

  <!-- Key Highlights -->
  <g transform="translate(48, 270)">
    <!-- Item 1 -->
    <circle cx="10" cy="15" r="5" fill="#34d399" />
    <text x="26" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#f0fdf4">
      2026 국가 5대 암 정밀검진
    </text>

    <!-- Item 2 -->
    <circle cx="10" cy="55" r="5" fill="#34d399" />
    <text x="26" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#f0fdf4">
      최신 3.0T MRI &amp; 저선량 CT 구비
    </text>

    <!-- Item 3 -->
    <circle cx="10" cy="95" r="5" fill="#34d399" />
    <text x="26" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="20" font-weight="700" fill="#f0fdf4">
      위·대장내시경 당일 동시 진행
    </text>
  </g>

  <!-- Bottom CTA Container -->
  <g transform="translate(48, 435)" filter="url(#shadow2)">
    <rect x="0" y="0" width="504" height="96" rx="14" fill="url(#btnGrad2)" />
    
    <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="15" font-weight="600" fill="#d1fae5">
      검진 프로그램 상담 · 예약
    </text>
    <text x="32" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="0.5">
      02-555-8275
    </text>

    <!-- Arrow button -->
    <g transform="translate(420, 26)">
      <circle cx="24" cy="24" r="24" fill="#ffffff" />
      <path d="M20 16 L28 24 L20 32" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Small Footer Tag -->
  <text x="300" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif" font-size="12" font-weight="500" fill="#6ee7b7" opacity="0.6" text-anchor="middle">
    국민건강보험공단 지정 우수검진기관
  </text>
</svg>
